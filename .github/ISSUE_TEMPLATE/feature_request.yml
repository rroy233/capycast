name: 功能建议
description: 提议新功能或现有体验改进
title: "[Feature] "
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有内容相同的建议。
          required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与问题
      description: 请说明谁会在什么情况下遇到什么问题。
      placeholder: 当我……时，希望能够……，因为……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互、行为或设置项。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 可选。说明目前如何解决，以及现有方式的不足。

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可附参考产品、流程图或其他背景材料。

