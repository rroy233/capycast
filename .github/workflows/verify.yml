name: Verify Android build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Determine verification scope
    runs-on: ubuntu-latest
    outputs:
      needs_android_build: ${{ steps.scope.outputs.needs_android_build }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect files requiring Android verification
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "needs_android_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual runs always verify the Android build."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$HEAD_SHA"
          fi

          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "The comparison base is unavailable; running Android verification."
            echo "needs_android_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="$(git diff --name-only "$base_sha...$head_sha")"
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          if [ -z "$changed_files" ]; then
            echo "No changed files detected; running Android verification."
            echo "needs_android_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq '^(app/|gradle/|buildSrc/|build-logic/|gradlew(\.bat)?$|settings\.gradle(\.kts)?$|build\.gradle(\.kts)?$|gradle\.properties$)'; then
            echo "needs_android_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Android source or Gradle build configuration changed; skipping Android verification."
            echo "needs_android_build=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Unit tests, lint and assemble
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.needs_android_build == 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify unit tests, lint and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: capycast-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
